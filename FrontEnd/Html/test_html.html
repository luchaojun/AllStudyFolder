<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式登录页面</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 登录卡片样式 - 修改了最大宽度和响应式规则 */
        .login-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 0 0 2px #000; /* 无偏移无模糊，仅扩展 */
            width: 100%;
            max-width: 450px; /* 适当增大最大宽度 */
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px; /* 增大标题字号 */
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 16px;
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 25px; /* 增加间距 */
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
            font-size: 16px; /* 增大标签字号 */
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px; /* 增大输入框内边距 */
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }
        
        /* 按钮样式 */
        .login-button {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px; /* 增大按钮字号 */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-button:hover {
            background-color: #3a7bc8;
            transform: translateY(-1px);
        }
        
        /* 辅助链接 */
        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 15px;
        }
        
        .login-footer a {
            color: #4a90e2;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* 响应式调整 */
        @media (min-width: 768px) {
            /* 平板电脑及以上设备 */
            .login-container {
                max-width: 500px; /* 平板电脑上更大的宽度 */
                padding: 50px;
            }
            
            .login-header h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }
            
            .form-group input {
                padding: 16px 18px;
                font-size: 17px;
            }
            
            .login-button {
                padding: 16px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            /* 手机设备 */
            .login-container {
                padding: 30px;
                border-radius: 8px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
            
            .form-group input {
                padding: 12px 14px;
            }
            
            .login-button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>欢迎登录</h1>
            <p>请输入您的账号信息</p>
        </div>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            
            <button type="submit" class="login-button">登录</button>
        </form>
        
        <div class="login-footer">
            <a href="#">忘记密码</a>
            <a href="#">注册账号</a>
        </div>
    </div>
</body>
</html>
